# Impede o Supabase free tier de pausar o projeto por inatividade (7 dias sem request).
# A key abaixo é a publishable (anon) — pública por design, já servida em oblivian.net.
# Só roda a partir da branch main (regra do GitHub p/ cron) — ativa após o merge.
name: supabase-keepalive
on:
  schedule:
    - cron: "17 3 * * *" # 1x/dia, 03:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping Supabase REST
        run: |
          curl -fsS \
            -H "apikey: sb_publishable_nrsuEnyv8UFQ6lf3tTMR_Q_s3XQtcK6" \
            -H "Authorization: Bearer sb_publishable_nrsuEnyv8UFQ6lf3tTMR_Q_s3XQtcK6" \
            "https://iukovmmphkpshrpxymri.supabase.co/rest/v1/profiles?select=id&limit=1" > /dev/null
          echo "supabase ok"
